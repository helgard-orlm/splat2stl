[project]
name = "splat2stl"
version = "0.1.0"
description = "3D Gaussian Splat (.ply) to watertight, printable STL/OBJ via silhouette carving"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "scipy", "scikit-image", "trimesh", "plyfile", "pillow"]

[project.scripts]
splat2stl = "splat2stl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splat2stl"]
